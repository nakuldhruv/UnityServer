services:
  dockermultiwebapp:
    image: dockermultiwebapp
    build:
      context: .
      dockerfile: DockerMultiWebApp/Dockerfile
    ports:
      - "8086:8086"
      - "8087:8087"
    environment:
      - ASPNETCORE_HTTP_PORTS=8086
      - ASPNETCORE_HTTPS_PORTS=8087
      - ASPNETCORE_Kestrel__Certificates__Default__Password=mypass123
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - JokeApi__BaseUrl=http://dockermultiwebapi:8085
    volumes:
      - ./DockerMultiWebApp/wwwroot/https/aspnetapp.pfx:/https/aspnetapp.pfx:ro

  dockermultiwebapi:
    image: dockermultiwebapi
    build:
      context: .
      dockerfile: DockerMultiWebApi/Dockerfile
    ports:
      - "8085:8085"
    environment:
      - ASPNETCORE_HTTP_PORTS=8085

  mongodb:
    image: mongo:8.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root123456
      - MONGO_INITDB_DATABASE=jokedb
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:

